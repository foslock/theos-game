<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Lockwood Mac</title>
    <!-- Fetched during parse: the frame is not requested until the bundle has run, and nothing shows until it arrives. -->
    <link rel="preload" as="image" href="assets/frame/mac.png" />
    <style>
      /* Bitmap fonts, so they only look right at their design size or exact multiples of it. */
      @font-face {
        font-family: 'Silkscreen';
        src: url('assets/fonts/Silkscreen-Regular.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'Press Start 2P';
        src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-display: block;
      }
      html, body { margin: 0; padding: 0; background: #2a2622; height: 100%; overflow: hidden; }
      body {
        background: radial-gradient(ellipse at center, #3a342d 0%, #1c1916 100%);
        font-family: monospace;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Hidden until the case art has loaded, so the dark screen and its prompt cannot appear first. */
      #stage { position: fixed; inset: 0; opacity: 0; transition: opacity 0.25s ease-out; }
      #stage.ready { opacity: 1; }
      #mac { position: absolute; }
      /* Sliding from the whole-Mac view to the close-up of the screen after power-on. */
      #mac.zooming, #mac.zooming #screen {
        transition: left 0.9s cubic-bezier(0.4, 0, 0.2, 1), top 0.9s cubic-bezier(0.4, 0, 0.2, 1),
          width 0.9s cubic-bezier(0.4, 0, 0.2, 1), height 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #bezel {
        position: absolute; inset: 0; width: 100%; height: 100%;
        image-rendering: pixelated; image-rendering: crisp-edges;
        pointer-events: none; z-index: 3;
      }
      #screen { position: absolute; background: #000; overflow: hidden; }
      #mac.bare #screen { background: #000; }
      #game { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 50%; }
      #game.off { transform: scale(0.55, 0.004); opacity: 0; }
      #game.warming {
        transition: transform 0.55s cubic-bezier(0.2, 1.35, 0.45, 1), opacity 0.15s linear;
        transform: scale(1, 1); opacity: 1;
      }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 100% !important; height: 100% !important; display: block; }
      #flash {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: #fff; opacity: 0;
      }
      #flash.on { animation: crt-flash 0.7s ease-out forwards; }
      @keyframes crt-flash { 0% { opacity: 0.9; } 30% { opacity: 0.25; } 100% { opacity: 0; } }
      #vignette {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 66%, rgba(0, 0, 0, 0.2) 100%);
        box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.3);
        transition: opacity 0.6s ease-out;
      }
      #mac.bare #vignette { display: none; }
      /* CRT glass: scanlines, a faint aperture grille, and a slow phosphor flicker. */
      /* background-size (the tile pitch) is set from JS; see crtPitch in frame.ts. */
      #crt {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background-image:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 45%, rgba(0, 0, 0, 0) 45% 100%),
          repeating-linear-gradient(to right, rgba(255, 60, 60, 0.05) 0 33.3%, rgba(60, 255, 60, 0.05) 33.3% 66.6%, rgba(60, 60, 255, 0.06) 66.6% 100%);
        mix-blend-mode: multiply;
        animation: crt-flicker 2.2s steps(3) infinite;
      }
      @keyframes crt-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.92; } }
      #screen.crt-off #crt { display: none; }
      #power {
        position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
        color: #8cff9a; font-size: 14px; letter-spacing: 1px; text-shadow: 0 0 6px #4cff6a;
        animation: blink 1.6s steps(1) infinite; cursor: pointer;
      }
      @keyframes blink { 50% { opacity: 0.25; } }
      #file-input { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <input id="file-input" type="file" accept="application/json,.json" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
