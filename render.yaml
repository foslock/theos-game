# Render Blueprint: deploys the built game as a static site.
# Connect this repo in the Render dashboard (New > Blueprint) or create a
# Static Site by hand with the same build command and publish directory.
services:
  - type: web
    name: theos-game
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Always revalidate the entry point so a new deploy is picked up immediately;
      # hashed bundle files and the art can be cached for a long time.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /bundle/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
